{% block modal %}
<div class="modal fade" id="update_Expediente" tabindex="-1" role="dialog" aria-labelledby="basicModal" aria-hidden="true">
    <div class="modal-dialog modal-xl ">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="myModalLabel">Actualizar Expediente</h4>
                <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
            </div>
            <input type="hidden" id="IDEXPEDIENTEEditHIDDEN" name="IDEXPEDIENTEEditHIDDEN"/>
            <input type="hidden" id="IDESTADOEXPEDIENTEEditHIDDEN" name="IDESTADOEXPEDIENTEEditHIDDEN"/>
            <div class="modal-body">
                <div class="container contenido">
                    <!-- Content Wrapper -->
                    <div id="content-wrapper" class="d-flex flex-column">
                        <!-- Main Content -->
                        <div id="content">
                            <div id="accordion">
    <!--Bloque Expediente-->
                                    <div class="card shadow mb-4">
                                        <div class="card-header py-3">
                                            <a class="collapsed card-link" data-toggle="collapse" href="#collapseOne">
                                                <div class="row" >
                                                    <div class="col-md-12 mb-1">
                                                        <h5>Datos Expediente (Clickee aquí para ingresar los datos) </h5>
                                                    </div>
                                                </div>
                                            </a>
                                        </div>
                                        <div class="card-body">
                                            <fieldset class="form-group">
                                                <div id="collapseOne" class="collapse show" data-parent="#accordion">
                                                    <div class="row">
                                                        <div class="form-group col-md-6 mb-2">
                                                            <label for="nombre"><strong>NRO. EXPEDIENTE </strong> </label>
                                                            <input type="text" class="form-control" align="left" title="Nro. Expediente" name="nroExpedienteEdit" id="nroExpedienteEdit" placeholder="Nro. Expediente" disabled/>
                                                        </div>

                                                        <div class="form-group col-md-6 mb-1">
                                                            <label for="nombre"><strong>ESTADO EXPEDIENTE *</strong> </label>
                                                            <select name="idEstadoExpedienteEdit" id="idEstadoExpedienteEdit" class="form-control" required>
                                                                 {% for estado in estadosExpedientes %}
                                                                    <option value="{{ estado.idEstadoExpediente }}">{{ estado.nombre }}</option>
                                                                {% endfor %}
                                                            </select>
                                                        </div>
                                                    </div>    
                                                    <div class="row">
                                                        <div class="form-group col-md-6 mb-1">
                                                            <label for="nombre"><strong>TIPO DE OBRA *</strong> </label>
                                                            <select name="idTipoObraEdit" id="idTipoObraEdit" class="form-control" required>
                                                                <option value="" selected>Seleccione Tipo de Obra</option>
                                                                {% for tipo in tiposObras %}
                                                                    <option value="{{ tipo.idTipoObra }}">{{ tipo.nombre }}</option>
                                                                {% endfor %}
                                                            </select>
                                                        </div>
                                                        <div class="form-group col-md-6 mb-2">
                                                            <label for="nombre"><strong>PARTIDA *</strong> </label>
                                                            <input type="number" class="form-control" align="left" title="Partida" name="nroPartidaEdit" id="nroPartidaEdit" placeholder="Partida *"  maxlength="100" required/>
                                                        </div>
                                                    </div>    
                                                    <div class="row">
                                                        <div class="form-group col-md-3 mb-2">
                                                            <label for="nombre"><strong>NRO. EXPEDIENTE MESA ENTRADA *</strong> </label>
                                                            <input type="text" class="form-control" align="left" title="Nro. Expediente Mesa Entrada" name="nroExpedienteMesaEntradaEdit" id="nroExpedienteMesaEntradaEdit" placeholder="Nro. Expediente Mesa Entrada*" oninput="this.value=this.value.toUpperCase()" maxlength="100" required/>
                                                        </div>
                                                        <div class="form-group col-md-3 mb-1">
                                                            <label for="descripcion"><strong>AÑO INGRESO M.ENTRADA * </strong> </label>
                                                            <input type="number" name="anioMesaEntradaEdit" class="form-control" id="anioMesaEntradaEdit" title="Año Ingreso Mesa de Entrada" placeholder="Ej: 2025" required min="2000" max="2025" size="4"/>
                                                        </div>
                                                        <div class="form-group col-md-3 mb-1">
                                                            <label for="descripcion"><strong>SUCESION * </strong> </label>
                                                            <select name="sucesionEdit" id="sucesionEdit" class="form-control" required>
                                                                <option value="1" >SI</option>
                                                                <option value="0" selected>NO</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <div class="row">
                                                        <div class="form-group col-md-12">
                                                            <label for="">OBSERVACIONES</label><br>
                                                            <textarea  name="observacionesEdit" cols="100" rows="2" class="form-control" id="observacionesEdit" title="Observaciones generales" maxlength="250" oninput="this.value=this.value.toUpperCase()" placeholder="Observaciones" ></textarea>
                                                        </div>   
                                                    </div>
                                                </div>                
                                        </fieldset>
                                    </div>
                                    </div>   
                            </div>    
                
                            <div class="modal-footer">
                                <button type="button" class="cancela btn btn-default" data-dismiss="modal">Cerrar</button>
                                <button type="button" class="acepta btn btn-success" id="modificar_Expediente">Actualizar</button>
                            </div>
                        <!-- /.container-fluid -->
                        </div>
                    <!-- End of Main Content -->	
                    </div>
                <!-- End of Page Wrapper -->
                </div>
            <!-- end of body block -->
            </div>
        </div>
    </div>
</div>

<script>

    
    document.getElementById('modificar_Expediente').addEventListener('click', async function(e) {
    e.preventDefault(); // Evita que el formulario haga un POST tradicional

    const id = document.getElementById('IDEXPEDIENTEEditHIDDEN').value;
    const idTipoObra = document.getElementById('idTipoObraEdit').value;
    const nroPartida = document.getElementById('nroPartidaEdit').value;
    const nroExpedienteMesaEntrada = document.getElementById('nroExpedienteMesaEntradaEdit').value;
    const anioMesaEntrada = document.getElementById('anioMesaEntradaEdit').value;
    const sucesion = document.getElementById('sucesionEdit').value;
    const observaciones = document.getElementById('observacionesEdit').value;
    const idEstadoExpedienteNuevo = document.getElementById('idEstadoExpedienteEdit').value;
    const idEstadoExpedienteActual = document.getElementById('IDESTADOEXPEDIENTEEditHIDDEN').value;

    try {
        const response = await fetch(`/expediente/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                idTipoObra: idTipoObra,
                nroPartida: nroPartida,
                nroExpedienteMesaEntrada: nroExpedienteMesaEntrada,
                anioMesaEntrada: anioMesaEntrada,
                sucesion: sucesion,
                observaciones: observaciones,
                idEstadoExpNuevo: idEstadoExpedienteNuevo,
                idEstadoExpActual: idEstadoExpedienteActual
            })
        });

        if (response.ok) {
            $('#update_Expediente').modal('hide');
            location.reload(); // recarga tabla con datos actualizados
        } else {
            const error = await response.json();
            alert('Error al actualizar Expediente: ' + (error.error || 'Error desconocido'));
        }
    } catch (err) {
        alert('Error de red o del servidor: ' + err.message);
    }
});
 
</script>
{% endblock modal %}
